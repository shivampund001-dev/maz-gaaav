<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="28%" stop-color="#047857"/>
      <stop offset="28%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Screen Background -->
  <rect width="380" height="760" rx="36" fill="url(#bgGrad)"/>

  <!-- Phone Status Bar -->
  <g fill="#FFFFFF" opacity="0.9" font-family="system-ui, sans-serif" font-size="12">
    <text x="32" y="28" font-weight="600">10:45</text>
    <g transform="translate(305, 18)" fill="#FFFFFF">
      <rect x="0" y="8" width="3" height="4" rx="0.5"/>
      <rect x="4" y="6" width="3" height="6" rx="0.5"/>
      <rect x="8" y="3" width="3" height="9" rx="0.5"/>
      <rect x="12" y="0" width="3" height="12" rx="0.5"/>
      <rect x="22" y="1" width="18" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x="24" y="3" width="12" height="6" rx="1" fill="#FFFFFF"/>
      <rect x="40" y="4" width="2" height="4" rx="0.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- App Header -->
  <g transform="translate(24, 46)">
    <text x="0" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="22">maz Gaaav</text>
    <text x="115" y="24" fill="#FEF08A" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="700" font-size="16">माझं गाव</text>
    <rect x="0" y="36" width="240" height="24" rx="12" fill="#065F46" opacity="0.85"/>
    <text x="10" y="52" fill="#A7F3D0" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="11" font-weight="600">📍 स्थान: माहूर बस स्टँड (Mahur)</text>
    <circle cx="310" cy="20" r="18" fill="#047857"/>
    <circle cx="310" cy="20" r="4" fill="#22C55E"/>
    <circle cx="310" cy="20" r="9" fill="none" stroke="#22C55E" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Main Hero Live Bus Card -->
  <g transform="translate(20, 130)" filter="url(#cardShadow)">
    <rect width="340" height="270" rx="22" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Top badge -->
    <rect x="16" y="16" width="120" height="24" rx="8" fill="#FEE2E2"/>
    <text x="26" y="32" fill="#DC2626" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="700" font-size="11">● लाईव्ह बस ट्रॅक</text>
    
    <text x="210" y="32" fill="#64748B" font-family="system-ui, sans-serif" font-weight="600" font-size="11">MH-26-B-4218</text>

    <!-- Route title: Kinwat to Mahurgad -->
    <text x="16" y="68" fill="#0F172A" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="800" font-size="18">किनवट ➔ बोधडी ➔ माहूर</text>
    <text x="16" y="86" fill="#64748B" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="500" font-size="12">किनवट आगार (नांदेड विभाग) • लालपरी</text>

    <!-- COUNTDOWN BOX -->
    <rect x="16" y="102" width="308" height="66" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="30" y="126" fill="#065F46" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="11" font-weight="700">माहूर स्टँडवर येण्याची वेळ (ETA)</text>
    <text x="30" y="154" fill="#047857" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="22" font-weight="900">अवघ्या ०८ मिनिटांत!</text>
    <rect x="220" y="116" width="90" height="38" rx="8" fill="#059669"/>
    <text x="232" y="132" fill="#FFFFFF" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="10" font-weight="700">अंतर: २.५ km</text>
    <text x="232" y="146" fill="#D1FAE5" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="9">वेग: ४० km/h</text>

    <!-- Route Line Progress Indicator -->
    <g transform="translate(20, 185)">
      <line x1="16" y1="12" x2="280" y2="12" stroke="#CBD5E1" stroke-width="3"/>
      <line x1="16" y1="12" x2="190" y2="12" stroke="#059669" stroke-width="3"/>
      
      <circle cx="20" cy="12" r="6" fill="#059669"/>
      <text x="6" y="28" font-size="9" fill="#059669" font-family="'Noto Sans Devanagari', system-ui" font-weight="600">किनवट आगार</text>
      
      <circle cx="105" cy="12" r="6" fill="#059669"/>
      <text x="94" y="28" font-size="9" fill="#059669" font-family="'Noto Sans Devanagari', system-ui" font-weight="600">बोधडी</text>
      
      <circle cx="190" cy="12" r="8" fill="#DC2626"/>
      <circle cx="190" cy="12" r="4" fill="#FFFFFF"/>
      <text x="175" y="28" font-size="10" fill="#DC2626" font-family="'Noto Sans Devanagari', system-ui" font-weight="800">माहूर (पायथा)</text>

      <circle cx="275" cy="12" r="5" fill="#94A3B8"/>
      <text x="255" y="28" font-size="9" fill="#64748B" font-family="'Noto Sans Devanagari', system-ui">माहूर गड</text>
    </g>

    <!-- Action Bar -->
    <rect x="16" y="225" width="148" height="34" rx="8" fill="#FEF3C7"/>
    <text x="24" y="246" fill="#B45309" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="11" font-weight="700">🔔 बस आल्यास अलार्म</text>

    <rect x="176" y="225" width="148" height="34" rx="8" fill="#F1F5F9"/>
    <text x="186" y="246" fill="#334155" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="11" font-weight="700">📞 किनवट डेपो संपर्क</text>
  </g>

  <!-- Upcoming Mahur & Kinwat Buses -->
  <g transform="translate(20, 420)">
    <text x="4" y="16" fill="#0F172A" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="800" font-size="16">पुढील बसेस (माहूर ↔ किनवट मार्ग)</text>

    <!-- Bus 1 Item -->
    <g transform="translate(0, 30)">
      <rect width="340" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="32" cy="32" r="18" fill="#FEE2E2"/>
      <text x="24" y="37" font-size="14">🚌</text>
      <text x="60" y="26" fill="#0F172A" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="700" font-size="14">११:१५ AM • माहूर ➔ किनवट लोकल</text>
      <text x="60" y="44" fill="#64748B" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="11">बोधडी मार्गे • सर्व थांब्यांवर थांबेल</text>
      <rect x="250" y="18" width="76" height="26" rx="6" fill="#ECFDF5"/>
      <text x="260" y="35" fill="#059669" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="700" font-size="11">वेळेवर</text>
    </g>

    <!-- Bus 2 Item -->
    <g transform="translate(0, 105)">
      <rect width="340" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="32" cy="32" r="18" fill="#FEF3C7"/>
      <text x="24" y="37" font-size="14">🚌</text>
      <text x="60" y="26" fill="#0F172A" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="700" font-size="14">१२:०० PM • माहूर ➔ नांदेड एक्सप्रेस</text>
      <text x="60" y="44" fill="#64748B" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="11">किनवट बायपास ➔ हिमायतनगर ➔ नांदेड</text>
      <rect x="250" y="18" width="76" height="26" rx="6" fill="#ECFDF5"/>
      <text x="260" y="35" fill="#059669" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="700" font-size="11">वेळेवर</text>
    </g>

    <!-- Bus 3 Item -->
    <g transform="translate(0, 180)">
      <rect width="340" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="32" cy="32" r="18" fill="#E0E7FF"/>
      <text x="24" y="37" font-size="14">🚌</text>
      <text x="60" y="26" fill="#0F172A" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="700" font-size="14">०१:३० PM • किनवट ➔ माहूर शक्तीपीठ फेरी</text>
      <text x="60" y="44" fill="#64748B" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="11">भाविकांसाठी विशेष लालपरी</text>
      <rect x="240" y="18" width="86" height="26" rx="6" fill="#FFFBEB"/>
      <text x="246" y="35" fill="#D97706" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-weight="700" font-size="11">+५ मि. उशीर</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 690)">
    <rect width="380" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="60" cy="26" r="16" fill="#ECFDF5"/>
    <text x="52" y="32" font-size="14">🏠</text>
    <text x="46" y="52" font-size="10" fill="#059669" font-family="'Noto Sans Devanagari', system-ui" font-weight="700">लाईव्ह</text>

    <text x="146" y="32" font-size="14">📅</text>
    <text x="130" y="52" font-size="10" fill="#64748B" font-family="'Noto Sans Devanagari', system-ui">वेळापत्रक</text>

    <text x="238" y="32" font-size="14">🗺️</text>
    <text x="231" y="52" font-size="10" fill="#64748B" font-family="'Noto Sans Devanagari', system-ui">मार्ग</text>

    <text x="322" y="32" font-size="14">👤</text>
    <text x="310" y="52" font-size="10" fill="#64748B" font-family="'Noto Sans Devanagari', system-ui">माझं गाव</text>
  </g>
</svg>
